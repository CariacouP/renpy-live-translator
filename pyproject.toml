[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "renpy-live-translator"
version = "1.0.0"
description = "Real-time live translation tool and background server for Ren'Py visual novels."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Luca Bankofski" }
]
keywords = ["renpy", "translation", "translator", "visual-novel", "localization", "live-translation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/CariacouP/renpy-live-translator"
Repository = "https://github.com/CariacouP/renpy-live-translator.git"
Issues = "https://github.com/CariacouP/renpy-live-translator/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # Module level import not at top of file (sys.path manipulation required for server/tests standalone execution)
    "E501",  # Line length handled gracefully without breaking long test strings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
